name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  preview-freshness:
    name: README preview freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ubuntu system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-liberation imagemagick libcairo2-dev libxml2-dev pkg-config python3-dev
      - uses: astral-sh/setup-uv@v6
      - name: Restore Node path for act
        if: ${{ env.ACT }}
        run: ./scripts/restore-act-node.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Restore Node path for act after Go setup
        if: ${{ env.ACT }}
        run: ./scripts/restore-act-node.sh
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Restore Node path for act after R setup
        if: ${{ env.ACT }}
        run: ./scripts/restore-act-node.sh
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          needs: check
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate and verify README renderer previews
        run: ./scripts/check-readme-previews.sh

  source-archives:
    name: Tagged source archives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate coordinated version
        run: ./scripts/check-versions.sh "${GITHUB_REF_NAME#v}"
      - name: Package tagged sources
        run: ./scripts/package-sources.sh dist "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: ${{ !env.ACT }}
        with:
          name: source-archives
          path: dist/*
          if-no-files-found: error

  python-wheel:
    name: Python wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Restore Node path for act
        if: ${{ env.ACT }}
        run: ./scripts/restore-act-node.sh
      - name: Build wheel
        run: uv build --wheel python --out-dir dist
      - uses: actions/upload-artifact@v4
        if: ${{ !env.ACT }}
        with:
          name: python-wheel
          path: dist/*.whl
          if-no-files-found: error

  r-source-package:
    name: Checked R source package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Restore Node path for act
        if: ${{ env.ACT }}
        run: ./scripts/restore-act-node.sh
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck
          needs: check
      - name: Build and check R package
        run: ./scripts/test-r.sh
      - name: Collect checked source package
        run: |
          mkdir -p dist
          mv renderSbgnR_*.tar.gz dist/
      - uses: actions/upload-artifact@v4
        if: ${{ !env.ACT }}
        with:
          name: r-source-package
          path: dist/*.tar.gz
          if-no-files-found: error

  go-binaries:
    name: Go binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Restore Node path for act
        if: ${{ env.ACT }}
        run: ./scripts/restore-act-node.sh
      - name: Test and build all Go targets
        run: make -C go test release
      - name: Verify Linux Go executable
        run: |
          expected_version="$(awk -F '"' '/rendererVersion[[:space:]]*=/{ print $2; exit }' go/main.go)"
          test "$(go/dist/render_sbgn_go-linux-amd64 --version)" = "$expected_version"
      - uses: actions/upload-artifact@v4
        if: ${{ !env.ACT }}
        with:
          name: go-binaries
          path: go/dist/render_sbgn_go-*
          if-no-files-found: error

  rust-linux:
    name: Rust Linux musl (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Build static musl executable
        env:
          RUST_MUSL_TARGET: x86_64-unknown-linux-musl
        run: ./scripts/build-rust-musl.sh
      - name: Collect executable
        run: |
          mkdir -p dist
          cp rust/target/x86_64-unknown-linux-musl/release/render_sbgn_rs \
            dist/render_sbgn_rs-linux-amd64-musl
          file dist/render_sbgn_rs-linux-amd64-musl | grep -Eq 'statically linked|static-pie linked'
          expected_version="$(awk -F ' = ' '$1 == "version" { gsub(/"/, "", $2); print $2; exit }' rust/Cargo.toml)"
          test "$(dist/render_sbgn_rs-linux-amd64-musl --version)" = "$expected_version"
      - uses: actions/upload-artifact@v4
        if: ${{ !env.ACT }}
        with:
          name: rust-linux-amd64
          path: dist/render_sbgn_rs-linux-amd64-musl
          if-no-files-found: error

  rust-macos:
    name: Rust macOS (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Build macOS executable
        run: |
          cargo build --manifest-path rust/Cargo.toml --release --target aarch64-apple-darwin --bin render_sbgn_rs
          mkdir -p dist
          cp rust/target/aarch64-apple-darwin/release/render_sbgn_rs \
            dist/render_sbgn_rs-darwin-arm64
          expected_version="$(awk -F ' = ' '$1 == "version" { gsub(/"/, "", $2); print $2; exit }' rust/Cargo.toml)"
          test "$(dist/render_sbgn_rs-darwin-arm64 --version)" = "$expected_version"
      - uses: actions/upload-artifact@v4
        if: ${{ !env.ACT }}
        with:
          name: rust-macos-arm64
          path: dist/render_sbgn_rs-darwin-arm64
          if-no-files-found: error

  rust-windows:
    name: Rust Windows (amd64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build Windows executable
        run: cargo build --manifest-path rust/Cargo.toml --release --target x86_64-pc-windows-msvc --bin render_sbgn_rs
      - name: Collect executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item rust/target/x86_64-pc-windows-msvc/release/render_sbgn_rs.exe dist/render_sbgn_rs-windows-amd64.exe
          $expectedVersion = (Select-String -Path rust/Cargo.toml -Pattern '^version = "(.+)"$').Matches[0].Groups[1].Value
          $version = & dist/render_sbgn_rs-windows-amd64.exe --version
          if ($version -ne $expectedVersion) { throw "Unexpected version: $version" }
      - uses: actions/upload-artifact@v4
        if: ${{ !env.ACT }}
        with:
          name: rust-windows-amd64
          path: dist/render_sbgn_rs-windows-amd64.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - preview-freshness
      - source-archives
      - python-wheel
      - r-source-package
      - go-binaries
      - rust-linux
      - rust-macos
      - rust-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        if: ${{ !env.ACT }}
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        if: ${{ !env.ACT }}
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish release assets
        if: ${{ !env.ACT }}
        uses: softprops/action-gh-release@v2
        with:
          body: |
            Coordinated render_sbgn release.

            Linux and Windows executables target Intel/AMD x86_64. macOS
            executables target Apple silicon arm64. See `SHA256SUMS.txt` to
            verify downloads and the repository README for runtime details.
          append_body: true
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
