name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-all-renderers:
    name: Ubuntu - Python, Rust musl, Go, and R
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Ubuntu system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcairo2-dev libxml2-dev pkg-config python3-dev

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Restore Node path for act
        if: ${{ env.ACT }}
        run: |
          node_path="$(/usr/bin/find /opt/acttoolcache/node -type f -name node | /usr/bin/head -n 1)"
          echo "${node_path%/node}" >> "$GITHUB_PATH"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Restore Node path for act after Go setup
        if: ${{ env.ACT }}
        run: |
          node_path="$(/usr/bin/find /opt/acttoolcache/node -type f -name node | /usr/bin/head -n 1)"
          echo "${node_path%/node}" >> "$GITHUB_PATH"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Restore Node path for act after R setup
        if: ${{ env.ACT }}
        run: |
          node_path="$(/usr/bin/find /opt/acttoolcache/node -type f -name node | /usr/bin/head -n 1)"
          echo "${node_path%/node}" >> "$GITHUB_PATH"

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck
          needs: check

      # Keep this after Node-based actions for compatibility with nektos/act.
      - name: Set up Rust with musl
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
          components: rustfmt

      - name: Test all renderers
        run: ./scripts/test-all.sh

      - name: Build and verify Rust musl release
        run: |
          ./scripts/build-rust-musl.sh
          binary="rust/target/x86_64-unknown-linux-musl/release/render_sbgn_rs"
          test "$("$binary" --version)" = "0.0.5"
          file "$binary" | grep -Eq 'statically linked|static-pie linked'
