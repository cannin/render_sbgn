[package]
name = "render_sbgn_rs"
version = "0.0.9"
edition = "2021"

[dependencies]
anyhow = "1.0"
ahash = { version = "=0.8.11", default-features = false }
fontdue = "0.8"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "png-format"] }
xmltree = "0.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
base64 = "0.22.1"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true
